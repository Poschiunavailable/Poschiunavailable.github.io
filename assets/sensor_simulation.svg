<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"
    aria-label="Abstract sensor-simulation graphic: a perspective ground grid with radial sensor sweeps and detected point clusters">
  <title>Sensor simulation</title>
  <!-- Original abstract artwork for the simulation/validation section.
       Deliberately generic: no employer branding, product UI or IP. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2230"/>
      <stop offset="55%" stop-color="#212836"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <radialGradient id="sweep" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#aae8ff" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#81a8d1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#81a8d1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81a8d1" stop-opacity="0"/>
      <stop offset="100%" stop-color="#81a8d1" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#eab180" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#eab180" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Perspective ground grid: horizon at y=430, sensor origin at x=800 -->
  <g stroke="url(#fade)" fill="none" stroke-width="1.4">
    <line x1="800" y1="430" x2="-900" y2="900"/>
    <line x1="800" y1="430" x2="-380" y2="900"/>
    <line x1="800" y1="430" x2="40" y2="900"/>
    <line x1="800" y1="430" x2="370" y2="900"/>
    <line x1="800" y1="430" x2="620" y2="900"/>
    <line x1="800" y1="430" x2="800" y2="900"/>
    <line x1="800" y1="430" x2="980" y2="900"/>
    <line x1="800" y1="430" x2="1230" y2="900"/>
    <line x1="800" y1="430" x2="1560" y2="900"/>
    <line x1="800" y1="430" x2="1980" y2="900"/>
    <line x1="800" y1="430" x2="2500" y2="900"/>
  </g>

  <!-- Horizontal depth bands, spacing compressed toward the horizon -->
  <g stroke="#81a8d1" fill="none">
    <line x1="0" y1="452" x2="1600" y2="452" stroke-opacity="0.10" stroke-width="1"/>
    <line x1="0" y1="482" x2="1600" y2="482" stroke-opacity="0.14" stroke-width="1"/>
    <line x1="0" y1="527" x2="1600" y2="527" stroke-opacity="0.18" stroke-width="1.1"/>
    <line x1="0" y1="592" x2="1600" y2="592" stroke-opacity="0.22" stroke-width="1.2"/>
    <line x1="0" y1="682" x2="1600" y2="682" stroke-opacity="0.26" stroke-width="1.3"/>
    <line x1="0" y1="800" x2="1600" y2="800" stroke-opacity="0.30" stroke-width="1.4"/>
  </g>

  <!-- Sensor sweep cone -->
  <path d="M800 430 L120 900 L1480 900 Z" fill="url(#sweep)"/>
  <path d="M800 438 L470 900 L520 900 Z" fill="url(#beam)" opacity="0.7"/>
  <path d="M800 438 L1090 900 L1140 900 Z" fill="url(#beam)" opacity="0.5"/>

  <!-- Concentric range rings around the sensor origin -->
  <g fill="none" stroke="#aae8ff">
    <ellipse cx="800" cy="900" rx="240" ry="62" stroke-opacity="0.28" stroke-width="1.3"/>
    <ellipse cx="800" cy="900" rx="430" ry="112" stroke-opacity="0.22" stroke-width="1.2"/>
    <ellipse cx="800" cy="900" rx="650" ry="170" stroke-opacity="0.16" stroke-width="1.1"/>
    <ellipse cx="800" cy="900" rx="900" ry="238" stroke-opacity="0.11" stroke-width="1"/>
    <ellipse cx="800" cy="900" rx="1180" ry="315" stroke-opacity="0.07" stroke-width="1"/>
  </g>

  <!-- Detected object: bounding box with corner brackets -->
  <g stroke="#eab180" fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M556 566 v-26 h30"/><path d="M700 540 h30 v26"/>
    <path d="M556 690 v26 h30"/><path d="M700 716 h30 v-26"/>
  </g>
  <rect x="556" y="540" width="174" height="176" fill="#eab180" fill-opacity="0.05"/>

  <g stroke="#aae8ff" fill="none" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M980 596 v-20 h24"/><path d="M1094 576 h24 v20"/>
    <path d="M980 682 v20 h24"/><path d="M1094 702 h24 v-20"/>
  </g>

  <!-- Returned point cloud -->
  <g fill="#aae8ff">
    <circle cx="596" cy="600" r="3.4" fill-opacity="0.85"/><circle cx="640" cy="586" r="2.8" fill-opacity="0.7"/>
    <circle cx="676" cy="608" r="3.2" fill-opacity="0.8"/><circle cx="612" cy="648" r="2.6" fill-opacity="0.65"/>
    <circle cx="660" cy="662" r="3" fill-opacity="0.75"/><circle cx="700" cy="640" r="2.4" fill-opacity="0.6"/>
    <circle cx="1012" cy="622" r="2.8" fill-opacity="0.7"/><circle cx="1050" cy="612" r="2.4" fill-opacity="0.6"/>
    <circle cx="1082" cy="640" r="2.6" fill-opacity="0.65"/><circle cx="1030" cy="668" r="2.2" fill-opacity="0.55"/>
  </g>
  <g fill="#81a8d1">
    <circle cx="300" cy="782" r="2.6" fill-opacity="0.5"/><circle cx="388" cy="742" r="2.2" fill-opacity="0.45"/>
    <circle cx="1300" cy="770" r="2.6" fill-opacity="0.5"/><circle cx="1216" cy="726" r="2.2" fill-opacity="0.45"/>
    <circle cx="470" cy="700" r="2" fill-opacity="0.4"/><circle cx="1160" cy="686" r="2" fill-opacity="0.4"/>
    <circle cx="884" cy="512" r="1.8" fill-opacity="0.35"/><circle cx="742" cy="500" r="1.8" fill-opacity="0.35"/>
  </g>

  <!-- Sensor origin marker -->
  <circle cx="800" cy="900" r="9" fill="#eab180" fill-opacity="0.9"/>
  <circle cx="800" cy="900" r="22" fill="none" stroke="#eab180" stroke-opacity="0.45" stroke-width="1.6"/>
  <circle cx="800" cy="900" r="40" fill="none" stroke="#eab180" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- Vignette so overlaid text stays legible -->
  <rect width="1600" height="900" fill="#0a0d14" opacity="0.16"/>
</svg>
